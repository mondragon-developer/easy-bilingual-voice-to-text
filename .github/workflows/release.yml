# Releases publish themselves: bump __version__ in src/__init__.py, update
# RELEASE_NOTES.md, and push to main. This workflow tests the code, builds
# both Windows zips, and publishes a GitHub Release tagged with that version.
# Pushes that don't change the version are skipped, so ordinary commits cost
# only the cheap version check.
#
# Still supported: pushing a tag by hand (git tag v2.1.0 && git push origin
# v2.1.0), or "Run workflow" from the Actions tab.
#
# The tag is created by the release step itself rather than pushed from a
# job — a tag pushed with GITHUB_TOKEN would not start a new workflow run,
# so the release would never build.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # tags, so we can tell an already-released version
      - id: pick
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            release=true
          else
            tag="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/__init__.py)"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              release=false
              echo "::notice::$tag is already released — nothing to do."
            else
              release=true
              echo "::notice::Releasing $tag."
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # UI tests (tests/test_app.py) need an interactive desktop and run
      # locally; CI runs the logic suite.
      - run: python -m pytest tests --ignore tests/test_app.py -q

  build-and-release:
    needs: [version, test]
    runs-on: windows-latest
    env:
      # Signing turns on automatically once the Azure secrets are configured
      # in Settings -> Secrets and variables -> Actions.
      SIGNING_ENABLED: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      # Lockfile = releases are built from exact, recorded versions AND
      # verified bytes. --require-hashes makes a hijacked re-upload to PyPI
      # fail the build instead of shipping inside a signed binary.
      - run: pip install --require-hashes -r requirements-lock.txt
      - run: pip install pyinstaller

      - name: Build (PyInstaller)
        run: powershell -ExecutionPolicy Bypass -File scripts/build_release.ps1 -Stage build

      - name: Sign SpeechToText.exe (Azure Trusted Signing)
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293  # v0.5.11
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: mondragon-developer
          certificate-profile-name: securepass-signing
          files-folder: dist/SpeechToText
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Zip release assets
        run: powershell -ExecutionPolicy Bypass -File scripts/build_release.ps1 -Stage zip

      # The exe must actually load the model and transcribe, or no release.
      # (Catches frozen-build-only failures that unit tests can't see.)
      - name: Self-test the built exe
        env:
          STT_MODEL: tiny  # small download; the code path is identical
        run: |
          $p = Start-Process dist\SpeechToText\SpeechToText.exe -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path selftest.log) { Get-Content selftest.log }
          if ($p.ExitCode -ne 0) { throw "Selftest failed with exit code $($p.ExitCode)" }

      - name: Generate SHA-256 checksums
        run: |
          cd release
          Get-FileHash *.zip -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)"
          } | Out-File -Encoding ascii checksums.txt
          Get-Content checksums.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            release/SpeechToText-Windows-GPU.zip
            release/SpeechToText-Windows-CPU.zip
            release/checksums.txt
